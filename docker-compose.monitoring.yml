services:
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      AUTH_USER: ${AUTH_USER:-canopy}
      # canopy
      AUTH_PASSWORDHASH: ${AUTH_PASSWORDHASH:-"$$2a$$14$$0IP2/ZvbwWQ0JsJp6B8IpOYxME/6KSuPY3l4Hpj8phNTMdjMdh8aa"}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    expose:
      - "9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    expose:
      - "9093"
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:12.3
    container_name: grafana
    restart: unless-stopped
    # served through caddy at https://monitoring.<DOMAIN>
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-canopy}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-canopy}
      GF_USERS_ALLOW_SIGN_UP: "false"
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/automatic.yaml
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped
    command: ["--config.file=/etc/loki/config.yaml"]
    # served through caddy at https://loki.<DOMAIN> (basic-auth)
    expose:
      - "3100"
    configs:
      - source: loki_config
        target: /etc/loki/config.yaml
    volumes:
      # /loki is pre-owned by the loki user in the image, so a fresh named
      # volume inherits the right permissions (uid 10001)
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:

configs:
  caddyfile:
    content: |
      # Same-origin API paths on a UI host.
      # args[0] = rpc upstream, args[1] = admin upstream
      (api_routes) {
      	handle /rpc* {
      		uri strip_prefix /rpc
      		rewrite / /v1/eth
      		reverse_proxy {args[0]}
      	}
      	handle /adminrpc/v1/admin/* {
      		uri strip_prefix /adminrpc
      		reverse_proxy {args[1]}
      	}
      	handle /adminrpc* {
      		uri strip_prefix /adminrpc
      		rewrite / /v1/tx
      		reverse_proxy {args[0]}
      	}
      }

      (auth) {
      	basic_auth {args[:]} {
      		{$$AUTH_USER} {$$AUTH_PASSWORDHASH}
      	}
      }

      wallet.{$$DOMAIN} {
      	@protected not path /rpc*
      	import auth @protected
      	import api_routes node:50002 node:50003
      	handle {
      		reverse_proxy node:50000
      	}
      }

      explorer.{$$DOMAIN} {
      	@protected path /adminrpc*
      	import auth @protected
      	import api_routes node:50002 node:50003
      	handle {
      		reverse_proxy node:50001
      	}
      }

      rpc.{$$DOMAIN} {
      	rewrite / /v1/eth
      	reverse_proxy node:50002
      }

      adminrpc.{$$DOMAIN} {
      	import auth
      	@admin path /v1/admin/*
      	handle @admin {
      		reverse_proxy node:50003
      	}
      	handle {
      		rewrite / /v1/tx
      		reverse_proxy node:50002
      	}
      }

      monitoring.{$$DOMAIN} {
      	reverse_proxy grafana:3000
      }

  prometheus_config:
    content: |
      global:
        scrape_interval: 15s

      rule_files:
        - /etc/prometheus/alerts.yml

      alerting:
        alertmanagers:
          - static_configs:
              - targets: ["alertmanager:9093"]

      scrape_configs:
        - job_name: canopy-nodes
          static_configs:
            - targets: ["node:9090"]

        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

  alertmanager_config:
    content: |
      route:
        receiver: notifications
        group_by: ["alertname"]
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 4h

      receivers:
        - name: notifications
          ${ALERTS_DISCORD_WEBHOOK:+discord_configs:}
          ${ALERTS_DISCORD_WEBHOOK:+  - webhook_url: "${ALERTS_DISCORD_WEBHOOK}"}
          ${ALERTS_PAGERDUTY_TOKEN:+pagerduty_configs:}
          ${ALERTS_PAGERDUTY_ROUTING_KEY:+  - routing_key: "${ALERTS_PAGERDUTY_ROUTING_KEY}"}

  grafana_datasources:
    content: |
      apiVersion: 1
      datasources:

        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: true
          jsonData:
            manageAlerts: true


        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100

  loki_config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

  alloy_config:
    content: |
      discovery.docker "containers" {
      	host             = "unix:///var/run/docker.sock"
      	refresh_interval = "15s"

      	filter {
      		name   = "name"
      		values = ["node", "caddy", "prometheus", "grafana", "loki", "alloy"]
      	}
      }

      discovery.relabel "containers" {
      	targets = discovery.docker.containers.targets

      	rule {
      		source_labels = ["__meta_docker_container_name"]
      		regex         = "/(.*)"
      		target_label  = "container"
      	}
      }

      loki.source.docker "containers" {
      	host       = "unix:///var/run/docker.sock"
      	targets    = discovery.relabel.containers.output
      	forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
      	endpoint {
      		url = "http://loki:3100/loki/api/v1/push"
      	}
      }
